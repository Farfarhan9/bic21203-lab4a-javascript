<!DOCTYPE html>
<html>
<body>

<h1>Number generator</h1>

<button id="generateBtn" type="button">Generate</button>
<ol id="numberList"></ol>



<script>
    function generateNumbers() {
        const numberList = document.getElementById("numberList");
        numberList.innerHTML = ""; // Clear the list

        for (let i = 1; i <= 5; i++) {
            const listItem = document.createElement("li");
            listItem.textContent = "The number is: " + (Math.floor(Math.random() * 100) + 1); // Generate a random number between 1 and 100
            numberList.appendChild(listItem);
        }
    }

    document.getElementById("generateBtn").addEventListener("click", generateNumbers);
</script>
</body>
</html>
